<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            margin: 20px;
            width: 200px;
            height: 200px;
            border: 1px solid black;
        }
        .linear {
            background-image: linear-gradient( black 30%, red 50% , red , yellow 75%);
        }
        .radial {
            background-image: radial-gradient( blue 30%, rgb(160, 172, 211));
        }
    </style>
</head>
<body>
    <div class="linear"></div>
    <div class="radial"></div>
</body>
</html>
