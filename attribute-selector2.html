<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form {
            padding: 20px;
        }
        input {
            margin: 0 5px;
        }
        input[type="email"], input[type="password"]{
            color: darkblue;
            background-color: aliceblue;
            border: 1px solid rgba(0, 0, 255, 0.329);
            border-radius: 30px;
            height: 20px;
            width: 150px;
            padding-left: 20px;
        }
        input[type="submit"]{
            height: 25px;
            width: 150px;
            border: none;
            border-radius: 30px;
            background-color: rgba(233, 227, 220, 0.301);
            color: rgb(236, 204, 162);
        }
    </style>
</head>
<body>
    <form>
        <input type="email" placeholder="Enter your email">
        <br><br>
        <input type="password" placeholder="Enter your password">
        <br><br>
        <input type="submit" value="SIGN IN">
    </form>
</body>
</html>
